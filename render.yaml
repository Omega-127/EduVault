services:
  # -------------------------------------------------------------
  # EduVault Backend — FastAPI Web Service on Render
  # -------------------------------------------------------------
  - type: web
    name: eduvault-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://*.vercel.app,http://localhost:3000"
      - key: DATABASE_URL
        fromDatabase:
          name: eduvault-db
          property: connectionString
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: VECTOR_DB
        value: chromadb
      - key: CHROMA_PERSIST_DIRECTORY
        value: "./chroma_data"
      - key: RETRIEVAL_TOP_K
        value: "4"
      - key: SIMILARITY_THRESHOLD
        value: "0.35"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"

databases:
  # -------------------------------------------------------------
  # Managed PostgreSQL on Render
  # -------------------------------------------------------------
  - name: eduvault-db
    databaseName: eduvault
    user: eduvault
    region: oregon
    plan: free
